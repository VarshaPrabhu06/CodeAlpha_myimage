<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Gallery</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>My Gallery</h1>

<div class="filter-btns">
  <button class="active" onclick="filterImages('all')">All</button>
  <button onclick="filterImages('nature')">Nature</button>
  <button onclick="filterImages('city')">City</button>
  <button onclick="filterImages('people')">People</button>
</div>

<div class="gallery" id="gallery">
  <div class="pic nature"><img src="https://images.unsplash.com/photo-1501854140801-50d01698950b?w=500"><p>Mountain Lake</p></div>
  <div class="pic city"><img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?w=500"><p>City Skyline</p></div>
  <div class="pic people"><img src="https://images.unsplash.com/photo-1521119989659-a83eee488004?w=500"><p>Friends Outdoors</p></div>
  <div class="pic nature"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=500"><p>Forest Path</p></div>
  <div class="pic city"><img src="https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=500"><p>Street at Night</p></div>
  <div class="pic people"><img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?w=500"><p>Portrait</p></div>
  <div class="pic nature"><img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=500"><p>Sunset Hills</p></div>
  <div class="pic city"><img src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=500"><p>Downtown</p></div>
</div>

<div id="lightbox" class="lightbox">
  <span id="closeBtn" class="close">&times;</span>
  <span id="prevBtn" class="arrow left">&#10094;</span>
  <img id="lightboxImg" src="">
  <span id="nextBtn" class="arrow right">&#10095;</span>
  <p id="caption"></p>
</div>

<script src="script.js"></script>
</body>
</html>
